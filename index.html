<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="단련">
<meta name="theme-color" content="#f0f7f0">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>단련 S2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#f0f7f0;overflow:hidden;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;color:#1a2e1a}
button,input,select{font-family:inherit;outline:none}
::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div id="root" style="padding:20px">로딩 중...</div>
<script>window.onerror=function(m,s,l,c,e){document.getElementById("root").innerHTML='<div style="padding:20px;color:red"><b>오류:</b> '+m+'</div>';return true}</script>
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
<script>if(!window.React)document.getElementById("root").innerHTML='<p style="color:red">React 로드 실패</p>'</script>
<script type="text/babel" data-presets="react">
const{useState,useEffect,useMemo,useCallback}=React;

/*═══ CONFIG ═══*/
const VER="S2 v1.3";
const START=new Date(2026,8,1); // 시즌2 시작 9/1
const END=new Date(2027,3,30); // 상체 목표 2027.4
const RSTART=new Date(2026,8,13); // 러닝 시작 9/13
const REND=new Date(2027,4,31); // 러닝 목표일
const TARGET={p:80,u:20};
const INIT={p:48,u:14}; // 시즌1 마지막 추정치
const G10K=55;

/*═══ 상체 월별 플랜 (8개월 완만 커브)
 근거: Plotkin22 레프점진, MTI GtG 40-60%, Nóbrega23 볼륨제한
 원칙: ①5세트 이하 ②맥스의 50% ③4주 1디로드 ④월 P+4 U+1 ═══*/
const BP={
 9:{mx:{p:50,u:15},st:{p:25,u:7},sets:5,ph:"재적응"},
 10:{mx:{p:53,u:15},st:{p:27,u:8},sets:5,ph:"기초"},
 11:{mx:{p:57,u:16},st:{p:29,u:8},sets:5,ph:"기초"},
 12:{mx:{p:61,u:17},st:{p:31,u:9},sets:5,ph:"축적"},
 1:{mx:{p:65,u:17},st:{p:33,u:9},sets:5,ph:"축적"},
 2:{mx:{p:69,u:18},st:{p:35,u:9},sets:5,ph:"강화"},
 3:{mx:{p:74,u:19},st:{p:37,u:10},sets:5,ph:"강화"},
 4:{mx:{p:80,u:20},st:{p:40,u:10},sets:5,ph:"피크"},
};
/* 디로드: 매월 4주차에 세트3, 레프40%로 감량 → 앱에서 자동 적용 */
const DELOAD_WEEK=4; // 매월 4째주

const BT=[
 {d:"2026-10-03",t:{p:53,u:15}},{d:"2026-10-31",t:{p:57,u:16}},
 {d:"2026-11-28",t:{p:61,u:17}},{d:"2026-12-27",t:{p:61,u:17}},
 {d:"2027-01-31",t:{p:65,u:17}},{d:"2027-02-27",t:{p:69,u:18}},
 {d:"2027-03-27",t:{p:74,u:19}},{d:"2027-04-25",t:{p:80,u:20}},
];

/*═══ 인터벌 (9월 재적응→5월 테이퍼) Billat01+Seiler04+Esfarjani07 ═══*/
const IV={
 9:{s:"200m×6",p:"4:40~5:00",n:"재적응",ph:"P1"},
 10:{s:"400m×5",p:"4:50~5:10",n:"기초 재건",ph:"P1"},
 11:{s:"400m×6",p:"4:45~5:05",n:"볼륨 복구",ph:"P2"},
 12:{s:"4분×4",p:"5:00~5:10",n:"Seiler 4×4",ph:"P2"},
 1:{s:"800m×5",p:"4:50~5:10",n:"VO2max",ph:"P3"},
 2:{s:"1000m×4",p:"5:10~5:20",n:"레이스페이스",ph:"P3"},
 3:{s:"1000m×5",p:"5:15~5:25",n:"볼륨 피크",ph:"P4"},
 4:{s:"1200m×4",p:"5:20~5:30",n:"시뮬레이션",ph:"P5"},
 5:{s:"800m×3",p:"5:15~5:20",n:"테이퍼→55분",ph:"P6"},
};

const RTD=[
 {d:"2026-10-31",l:"10월 첫5K"},{d:"2026-11-28",l:"11월 5K"},
 {d:"2026-12-27",l:"12월 5K+첫10K"},
 {d:"2027-01-31",l:"1월 10K"},{d:"2027-02-27",l:"2월 10K"},
 {d:"2027-03-27",l:"3월 10K"},{d:"2027-04-26",l:"4월 리허설"},
 {d:"2027-05-24",l:"5월 최종🏁"},
];

const HOL=new Set(["2026-09-24","2026-09-25","2026-09-26","2026-10-03","2026-10-09","2026-12-25","2027-01-01","2027-02-16","2027-02-17","2027-02-18","2027-03-01","2027-05-05"]);

/*═══ HELPERS ═══*/
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const td0=()=>ymd(new Date());
const db=(a,b)=>Math.round((b-a)/86400000);
const ad=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const DN=["일","월","화","수","목","금","토"];
const wm=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return new Date(x.getFullYear(),x.getMonth(),x.getDate())};
const isWE=d=>{const w=new Date(d).getDay();return w===0||w===6};
/* 디로드 주: 매월 22일~말일 = 4째주 디로드 */
const isDL=d=>{const dt=new Date(d);return dt.getDate()>=22};

/* 시즌2 전용 키 (시즌1 데이터 안 건드림) */
const K1="s2-logs",K2="s2-tests",K3="s2-runs",K4="s2-rtests";
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};

const eL=()=>({p:0,u:0,core:0,yoga:0,med:0,nf:false,read:0,write:false,lang:0,ts:0});
const gL=(L,d)=>{const l=L[d];if(!l)return eL();return{...eL(),...l}};
/* 기록 지연일: 0-1일=실시간, 2일=70%, 3일+=50% */
const delayW=(ds,ts)=>{if(!ts)return 1;const delay=Math.floor((ts-new Date(ds).getTime())/86400000);if(delay<=1)return 1;if(delay===2)return 0.7;return 0.5};

function aPlan(mo,T){
 const b=BP[mo]||BP[9];
 const s=Object.entries(T).filter(([d])=>{const m=new Date(d).getMonth()+1;return m<mo||(m===mo&&new Date(d).getDate()<=15)}).sort(([a],[b])=>a.localeCompare(b));
 if(!s.length)return{...b,adj:false,rsn:null};
 const[td,r]=s[s.length-1];const aP=r.p||INIT.p,aU=r.u||INIT.u;
 const ti=BT.find(t=>t.d===td);
 const tP=ti?ti.t.p:b.mx.p,tU=ti?ti.t.u:b.mx.u;
 if(aP>=tP&&aU>=tU)return{...b,adj:true,behind:false,rsn:td.slice(5)+" 통과"};
 return{...b,st:{p:Math.max(Math.round(aP*0.55),10),u:Math.max(Math.round(aU*0.55),5)},
  sets:Math.min(b.sets+1,8),adj:true,behind:true,rsn:td.slice(5)+" 미달→조정"};
}

function wkRun(R,d){const m=wm(d);let e=0,i=0;for(let j=0;j<7;j++){const r=R[ymd(ad(m,j))];if(r){if(r.type==="인터벌")i++;else e++}}return{e,i,t:e+i}}

/* 두뇌 점수: med4→2pt, yoga7→2pt, read3, write1, lang4, nf1, run2 */
function brDay(ds,l,run){
 let e=0,mx=0;
 mx+=1;if(l&&l.nf)e+=1;
 mx+=2;if(l)e+=Math.min(l.med||0,4)*0.5;
 mx+=2;if(l)e+=Math.min(l.yoga||0,7)*(2/7);
 mx+=3;if(l)e+=Math.min(l.read||0,3);
 mx+=1;if(l&&l.write)e+=1;
 mx+=4;if(l)e+=Math.min(l.lang||0,4);
 if(new Date(ds)>=RSTART){mx+=2;if(run)e+=2}
 return{e,mx};
}

/*═══ APP ═══*/
function App(){
 const[L,sL]=useState(()=>ld(K1)||{});
 const[T,sT]=useState(()=>ld(K2)||{});
 const[R,sR]=useState(()=>ld(K3)||{});
 const[RT,sRT]=useState(()=>ld(K4)||[]);
 const[vw,sVw]=useState("rec");
 const[aD,sAD]=useState(td0());
 const[cM,sCM]=useState(()=>new Date(new Date().getFullYear(),new Date().getMonth(),1));

 useEffect(()=>sv(K1,L),[L]);useEffect(()=>sv(K2,T),[T]);
 useEffect(()=>sv(K3,R),[R]);useEffect(()=>sv(K4,RT),[RT]);

 const td=td0(),now=new Date(),tmr=ymd(ad(now,1));
 const isT=aD===td,mo=new Date(aD).getMonth()+1;
 const plan=useMemo(()=>aPlan(mo,T),[mo,T]);
 const tl=gL(L,aD),dL=db(now,END),dLR=db(now,REND);

 const go=useCallback(o=>{const d=ymd(ad(new Date(aD),o));if(d<ymd(START)||d>tmr)return;sAD(d)},[aD,tmr]);
 const goT=useCallback(()=>sAD(td),[td]);
 const uL=useCallback((d,p)=>sL(pr=>{const n={...pr};const old=gL(n,d);const merged={...old,...p};if(!old.ts||old.ts===0)merged.ts=Date.now();n[d]=merged;return n}),[]);
 const af=useCallback(k=>{uL(aD,{[k]:(tl[k]||0)+1})},[aD,tl]);
 const sf=useCallback(k=>{if((tl[k]||0)>0)uL(aD,{[k]:tl[k]-1})},[aD,tl]);
 const tg=useCallback(k=>{uL(aD,{[k]:!tl[k]})},[aD,tl]);
 const ac=useCallback((k,m)=>{uL(aD,{[k]:Math.min((tl[k]||0)+1,m)})},[aD,tl]);
 const sc=useCallback(k=>{if((tl[k]||0)>0)uL(aD,{[k]:tl[k]-1})},[aD,tl]);
 const svBT=(d,p,u)=>sT(pr=>{const n={...pr};if(p===null)delete n[d];else n[d]={p:+p||0,u:+u||0};sv(K2,n);return n});
 const wk=wkRun(R,now);

 /* forecast */
 const fc=useMemo(()=>{
  const s=Object.entries(T).filter(([d])=>d<=td).sort(([a],[b])=>a.localeCompare(b));
  const lat=s.length?s[s.length-1][1]:{p:INIT.p,u:INIT.u};
  let tP=0,tU=0,aP=0,aU=0;const c=new Date(START);
  while(c<=now&&c<=END){const m=c.getMonth()+1;const bp=BP[m];
   if(bp&&!isWE(c)){tP+=bp.sets*bp.st.p;tU+=bp.sets*bp.st.u}
   const l=L[ymd(c)];if(l&&bp){aP+=(l.p||0)*bp.st.p;aU+=(l.u||0)*bp.st.u}
   c.setDate(c.getDate()+1)}
  const pR=tP>0?aP/tP:1,uR=tU>0?aU/tU:1;
  const el=db(START,now)||1,tot=db(START,END),rm=Math.max(tot-el,1);
  return{pj:Math.round(lat.p+(TARGET.p-lat.p)*Math.min(pR,1.2)*(rm/(rm+el*0.3))),
   uj:Math.round(lat.u+(TARGET.u-lat.u)*Math.min(uR,1.2)*(rm/(rm+el*0.3))),
   get pOk(){return this.pj>=80},get uOk(){return this.uj>=20}};
 },[L,T,td]);
 const fcOk=fc.pOk&&fc.uOk;

 /* 3 goals */
 const goals=useMemo(()=>{
  let tD=0,bD=0,brMx=0,brE=0;const c=new Date(START);
  while(c<=now&&c<=END){const ds=ymd(c);
   if(!isWE(c)){tD++;
    const l=L[ds];const mp=BP[c.getMonth()+1];const run=R[ds];
    const w=delayW(ds,l?l.ts:0); // 기록 지연 가중치
    const br=brDay(ds,l,run);brMx+=br.mx;brE+=br.e*w;
    if(l&&mp&&(l.p||0)>=Math.ceil(mp.sets*0.5)&&(l.u||0)>=Math.ceil(mp.sets*0.5)&&(l.core||0)>=1){bD+=w}
   }c.setDate(c.getDate()+1)}
  const bR=tD>0?bD/tD:1,brR=brMx>0?brE/brMx:1;

  const allR=Object.keys(R).filter(d=>new Date(d)>=RSTART).sort();
  let gW=0,tW=0;
  if(allR.length>0){let w=new Date(wm(new Date(allR[0])));const cw=wm(now);
   while(w<cw){tW++;let wr=0,wi=0;
    for(let i=0;i<7;i++){const r=R[ymd(ad(w,i))];if(r){wr++;if(r.type==="인터벌")wi++}}
    if(wr>=3&&wi>=1)gW++;w=ad(w,7)}}
  const rR=tW>0?gW/tW:1;

  return{
   body:{rate:bR,ok:fcOk&&bR>=0.7,label:"푸시업80 풀업20",sub:"2027.4",color:fcOk&&bR>=0.7?"#16a34a":"#dc2626"},
   brain:{rate:brR,ok:brR>=0.7,label:"전교1등 두뇌",sub:"2027.5",color:brR>=0.7?"#16a34a":"#dc2626"},
   run:{rate:rR,ok:rR>=0.7,label:"10K 55분",sub:"2027.5",color:rR>=0.7?"#16a34a":"#dc2626",gW,tW},
   brE:Math.round(brE),brMx:Math.round(brMx)};
 },[L,fcOk,R,RT]);

 const nxRT=RTD.find(t=>t.d>=td);

 return(
  <div style={S.app}>
   {/* 헤더 */}
   <div style={{padding:"8px 14px 4px",background:"linear-gradient(135deg,#e8f5e8,#f0f7f0)",flexShrink:0}}>
    <div style={{display:"flex",justifyContent:"space-between"}}>
     <span style={{color:"#6b7c6b",fontSize:9,fontWeight:800}}>단련 {VER}</span>
     <span style={{color:"#2d5a27",fontSize:10,fontWeight:700}}>상체 D-{dL} · 러닝 D-{dLR}</span>
    </div>
   </div>
   {/* 3대 목표 */}
   <div style={{flexShrink:0}}>
    <div style={{display:"flex",gap:4,padding:"6px 10px",borderBottom:"1px solid rgba(0,0,0,0.03)"}}>
     {[goals.body,goals.brain,goals.run].map((g,i)=>(
      <div key={i} style={{flex:1,borderRadius:8,padding:"6px 3px",border:"1.5px solid "+g.color+"30",background:g.ok?"rgba(22,163,74,0.08)":"rgba(220,38,38,0.06)",textAlign:"center"}}>
       <div style={{fontSize:7,color:g.color,fontWeight:900,letterSpacing:"0.05em"}}>{g.sub}</div>
       <div style={{fontSize:10,fontWeight:900,lineHeight:1.3,marginTop:1}}>{g.label}</div>
       <div style={{fontSize:14,fontWeight:900,color:g.color,fontFamily:"monospace",marginTop:2}}>{Math.round(g.rate*100)}%</div>
      </div>))}
    </div>
    <div style={S.nav}>
     {[{id:"rec",l:"기록",i:"⊕"},{id:"run",l:"러닝",i:"🏃"},{id:"cal",l:"캘린더",i:"▦"},{id:"tst",l:"테스트",i:"▲"}].map(t=>(
      <button key={t.id} onClick={()=>sVw(t.id)} style={{...S.nb,...(vw===t.id?S.na:{})}}>
       <span style={{fontSize:14}}>{t.i}</span><span style={{fontSize:9}}>{t.l}</span>
      </button>))}
    </div>
   </div>
   <div style={S.ct}>
    {vw==="rec"&&<Rec plan={plan} tl={tl} aD={aD} isT={isT} td={td} tmr={tmr} goals={goals} fc={fc} af={af} sf={sf} tg={tg} ac={ac} sc={sc} go={go} goT={goT}/>}
    {vw==="run"&&<RunV R={R} sR={sR} td={td} now={now} wk={wk} aD={aD} go={go} goT={goT} isT={isT} tmr={tmr} goals={goals} nxRT={nxRT}/>}
    {vw==="cal"&&<Cal L={L} R={R} cM={cM} sCM={sCM} td={td} onSel={d=>{sAD(d);sVw("rec")}}/>}
    {vw==="tst"&&<Tst T={T} svT={svBT} fc={fc} RT={RT} sRT={sRT} td={td}/>}
   </div>
  </div>);
}

/*═══ 기록 탭 ═══*/
function Rec({plan,tl,aD,isT,td,tmr,goals,fc,af,sf,tg,ac,sc,go,goT}){
 const d=new Date(aD),dw=DN[d.getDay()],we=isWE(aD);
 return(
  <div style={{display:"flex",flexDirection:"column",gap:10}}>
   <DNav d={d} dw={dw} isT={isT} aD={aD} tmr={tmr} go={go} goT={goT}/>
   {we?(
    <div style={{...S.cd,textAlign:"center",padding:24}}>
     <div style={{fontSize:28,marginBottom:8}}>😴</div>
     <div style={{color:"#6b7c6b",fontSize:14,fontWeight:700}}>주말 · 완전 휴식</div>
    </div>
   ):(
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
     {plan.adj&&plan.rsn&&<div style={{...S.cd,padding:9,borderLeft:"4px solid "+(plan.behind?"#d97706":"#16a34a")}}>
      <div style={{color:plan.behind?"#b45309":"#16a34a",fontSize:10,fontWeight:800}}>{plan.rsn}</div></div>}
     {isDL(aD)&&<div style={{...S.cd,padding:9,borderLeft:"4px solid #2563eb",background:"rgba(37,99,235,0.04)"}}>
      <div style={{color:"#2563eb",fontSize:11,fontWeight:800}}>🔄 디로드 주 · 세트3 · 회복 우선</div></div>}

     <SH t="☀ 아침 루틴" c="#0891b2"/>
     <MC l="🧘 명상" s="3분×4회" c={tl.med||0} m={4} co="#0891b2" oA={()=>ac("med",4)} oS={()=>sc("med")}/>
     <MC l="🧘‍♀️ 스트레칭" s="3분×7회" c={tl.yoga||0} m={7} co="#16a34a" oA={()=>ac("yoga",7)} oS={()=>sc("yoga")}/>
     <Ck i="✏️" l="쓰기" s="20분" dn={tl.write} co="#6366f1" oT={()=>tg("write")}/>

     <SH t={"💪 GtG"+(isDL(aD)?" · 디로드":"")} c="#2563eb"/>
     <Ct l="푸시업" s={isDL(aD)?Math.round(plan.st.p*0.8)+"회×3세트 (디로드)":plan.st.p+"회×"+plan.sets+"세트"} c={tl.p} t={isDL(aD)?3:plan.sets} v={tl.p*(isDL(aD)?Math.round(plan.st.p*0.8):plan.st.p)} co="#2563eb" oA={()=>af("p")} oS={()=>sf("p")}/>
     <Ct l="풀업" s={isDL(aD)?Math.round(plan.st.u*0.8)+"회×3세트 (디로드)":plan.st.u+"회×"+plan.sets+"세트"} c={tl.u} t={isDL(aD)?3:plan.sets} v={tl.u*(isDL(aD)?Math.round(plan.st.u*0.8):plan.st.u)} co="#7c3aed" oA={()=>af("u")} oS={()=>sf("u")}/>
     <MC l="💪 복근" s="1분×2회" c={tl.core||0} m={2} co="#d97706" oA={()=>ac("core",2)} oS={()=>sc("core")}/>

     <SH t="📚 두뇌 · 낮~저녁" c="#0d9488"/>
     <MC l="📖 읽기" s="20분×3회" c={tl.read||0} m={3} co="#0d9488" oA={()=>ac("read",3)} oS={()=>sc("read")}/>
     <MC l="🌐 Foreign Language" s="30분×4회" c={tl.lang||0} m={4} co="#2563eb" oA={()=>ac("lang",4)} oS={()=>sc("lang")}/>
     <Ck i="🔖" l="N.F." s="" dn={tl.nf} co="#a855f7" oT={()=>tg("nf")}/>

     <div style={{...S.inf,textAlign:"center"}}>GtG · 실패까지 가지 말 것 · 세트 간 15분+</div>
    </div>
   )}
   <div style={{height:160}}/>
  </div>);
}

/*═══ 러닝 탭 ═══*/
function RunV({R,sR,td,now,wk,aD,go,goT,isT,tmr,goals,nxRT}){
 const d=new Date(aD),dw=DN[d.getDay()],mo=d.getMonth()+1;
 const cr=R[aD],iv=IV[mo],bfStart=new Date(aD)<RSTART;
 const[mn,sMn]=useState("");const[sv2,sSv]=useState(false);
 const logR=type=>{sR(p=>({...p,[aD]:{minutes:mn||"30",type,ts:Date.now()}}));sSv(true);sMn("");setTimeout(()=>sSv(false),1500)};
 const delR=()=>sR(p=>{const n={...p};delete n[aD];return n});
 return(
  <div style={{display:"flex",flexDirection:"column",gap:10}}>
   <DNav d={d} dw={dw} isT={isT} aD={aD} tmr={tmr} go={go} goT={goT}/>
   {bfStart?(
    <div style={{...S.cd,textAlign:"center",padding:24}}>
     <div style={{fontSize:28,marginBottom:8}}>🏖️</div>
     <div style={{color:"#0891b2",fontSize:14,fontWeight:700}}>러닝 준비기간</div>
     <div style={{color:"#6b7c6b",fontSize:11,marginTop:6}}>9/13 시작 · D-{db(now,RSTART)}</div>
    </div>
   ):(
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
     <div style={{...S.cd,padding:12}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
       <span style={{fontSize:13,fontWeight:800}}>이번 주</span>
       <span style={{color:goals.run.ok?"#16a34a":"#dc2626",fontSize:10,fontWeight:800}}>

       </span>
      </div>
      <div style={{display:"flex",gap:6,justifyContent:"center"}}>
       {[0,1,2].map(i=><div key={i} style={{width:18,height:18,borderRadius:5,background:i<wk.e?"#0891b2":"rgba(0,0,0,0.06)"}}/>)}
       <div style={{width:18,height:18,borderRadius:5,background:wk.i>=1?"#d97706":"rgba(0,0,0,0.06)"}}/>
       <span style={{fontSize:10,fontWeight:700,color:"#6b7c6b",marginLeft:4}}>{wk.t}/4{wk.t>=4?" 🎉":""}</span>
      </div>
     </div>
     {cr?(
      <div style={{...S.cd,borderLeft:"4px solid #16a34a"}}>
       <div style={{display:"flex",justifyContent:"space-between"}}>
        <span style={{color:"#16a34a",fontSize:14,fontWeight:800}}>✓ {cr.type} {cr.minutes}분</span>
        <button onClick={delR} style={{background:"none",border:"none",color:"#8a9b8a",fontSize:10}}>삭제</button>
       </div>
      </div>
     ):sv2?(
      <div style={{textAlign:"center",padding:16,color:"#16a34a",fontSize:16,fontWeight:900}}>✓</div>
     ):(
      <div style={S.cd}>
       <div style={{fontSize:10,color:"#6b7c6b",marginBottom:4}}>시간(분)</div>
       <input type="number" value={mn} onChange={e=>sMn(e.target.value)} style={{...S.inp,marginBottom:10}} placeholder="30"/>
       <div style={{display:"flex",gap:8}}>
        <button onClick={()=>logR("러닝")} style={{...S.bt,flex:1,background:"#0891b2",color:"#fff",border:"none",fontWeight:800}}>🏃 러닝</button>
        <button onClick={()=>logR("인터벌")} style={{...S.bt,flex:1,background:"#d97706",color:"#fff",border:"none",fontWeight:800}}>⚡ 인터벌</button>
       </div>
      </div>
     )}
     {iv&&<div style={{...S.cd,borderTop:"3px solid #d97706"}}>
      <div style={{color:"#d97706",fontSize:12,fontWeight:800,marginBottom:4}}>⚡ {mo}월 인터벌 ({iv.ph})</div>
      <div style={{fontSize:14,fontWeight:900,color:"#b45309"}}>{iv.s}</div>
      <div style={{color:"#6b7c6b",fontSize:10}}>{iv.p}/km · {iv.n}</div>
     </div>}
    </div>
   )}
   {nxRT&&<div style={{...S.cd,borderLeft:"4px solid #d97706",background:"rgba(217,119,6,0.04)"}}>
    <div style={{display:"flex",justifyContent:"space-between"}}>
     <div><div style={{color:"#d97706",fontSize:12,fontWeight:800}}>🏁 {nxRT.l}</div><div style={{color:"#6b7c6b",fontSize:10}}>{nxRT.d}</div></div>
     <div style={{color:"#b45309",fontSize:12,fontWeight:900}}>D-{db(now,new Date(nxRT.d))}</div>
    </div>
   </div>}
   <div style={{...S.inf,textAlign:"center"}}>주3회(30분+)+1회인터벌 · 목표: 2027.5 10K 55분</div>
   <div style={{height:160}}/>
  </div>);
}

/*═══ UI 컴포넌트 ═══*/

   {!isT&&aD!==tmr&&<div style={{marginTop:4}}>

   {isT&&<div style={{color:"#6b7c6b",fontSize:9,marginTop:2}}>오늘</div>}

 </div>);

/*═══ 캘린더 ═══*/
function Cal({L,R,cM,sCM,td,onSel}){
 const yr=cM.getFullYear(),mo=cM.getMonth();
 const fw=new Date(yr,mo,1).getDay(),dim=new Date(yr,mo+1,0).getDate();
 const cs=[];for(let i=0;i<fw;i++)cs.push({d:new Date(yr,mo,-(fw-1-i)),out:true});
 for(let i=1;i<=dim;i++)cs.push({d:new Date(yr,mo,i),out:false});
 while(cs.length%7)cs.push({d:new Date(yr,mo+1,cs.length-fw-dim+1),out:true});
 return(<div style={{display:"flex",flexDirection:"column",gap:8}}>
  <div style={{display:"flex",alignItems:"center",gap:6}}>
   <button onClick={()=>sCM(new Date(yr,mo-1,1))} style={S.cn}>‹</button>
   <div style={{flex:1,textAlign:"center",fontSize:15,fontWeight:800}}>{yr}년 {mo+1}월</div>
   <button onClick={()=>sCM(new Date(yr,mo+1,1))} style={S.cn}>›</button>
  </div>
  <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
   {DN.map((d,i)=><div key={d} style={{textAlign:"center",fontSize:9,fontWeight:800,padding:"4px 0",color:i===0?"#dc2626":"#6b7c6b"}}>{d}</div>)}
  </div>
  <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
   {cs.map((c,i)=>{const ds=ymd(c.d),iT=ds===td,log=L[ds],run=R[ds],we=isWE(c.d);
    let hB=false,hBr=false;
    if(log){hB=(log.p||0)>0||(log.u||0)>0;hBr=!!(log.med||log.nf||log.yoga||log.read||log.write||log.lang)}
    return(<div key={i} onClick={()=>ds<=ymd(ad(new Date(td),1))&&onSel(ds)}
     style={{minHeight:44,padding:2,borderRadius:5,background:iT?"rgba(22,163,74,0.12)":"#fff",
      border:iT?"1.5px solid rgba(22,163,74,0.5)":"1px solid rgba(0,0,0,0.05)",opacity:c.out?0.2:1}}>
     <div style={{fontSize:9,fontWeight:iT?900:600,color:iT?"#16a34a":c.d.getDay()===0?"#dc2626":"#1a2e1a",fontFamily:"monospace"}}>{c.d.getDate()}</div>
     <div style={{display:"flex",gap:2,marginTop:1}}>
      {hB&&<div style={{width:5,height:5,borderRadius:3,background:"#2563eb"}}/>}
      {hBr&&<div style={{width:5,height:5,borderRadius:3,background:"#16a34a"}}/>}
      {run&&<div style={{width:5,height:5,borderRadius:3,background:run.type==="인터벌"?"#d97706":"#0891b2"}}/>}
      {!hB&&!hBr&&!run&&we&&<div style={{fontSize:6,color:"#8a9b8a"}}>휴</div>}
     </div>
    </div>)})}
  </div>
  <div style={{fontSize:8,color:"#6b7c6b",textAlign:"center"}}>🔵상체 🟢두뇌 🔵런 🟠인터벌</div>
  <div style={{height:160}}/>
 </div>);
}

/*═══ 테스트 ═══*/
function Tst({T,svT,fc,RT,sRT,td}){
 const[ip,sIp]=useState("");const[iu,sIu]=useState("");
 const[tD2,sTD]=useState(td);const[s1,sS1]=useState(false);
 const[rTy,sRTy]=useState("5K");const[rTm,sRTm]=useState("");const[s2,sS2]=useState(false);
 const h1=()=>{if(!ip&&!iu)return;svT(tD2,ip,iu);sIp("");sIu("");sS1(true);setTimeout(()=>sS1(false),2000)};
 const h2=()=>{if(!rTm)return;sRT(p=>[...p,{type:rTy,time:rTm,date:td}]);sRTm("");sS2(true);setTimeout(()=>sS2(false),2000)};

 return(<div style={{display:"flex",flexDirection:"column",gap:12}}>
  <div style={{...S.cd,background:fc.pOk&&fc.uOk?"rgba(22,163,74,0.06)":"rgba(220,38,38,0.05)"}}>
   <div style={{color:"#6b7c6b",fontSize:9,fontWeight:800,marginBottom:4}}>2027.4 예상</div>
   <div style={{display:"flex",gap:12}}>
    <span style={{fontSize:24,fontWeight:900,color:fc.pOk?"#16a34a":"#dc2626",fontFamily:"monospace"}}>P{fc.pj}/80</span>
    <span style={{fontSize:24,fontWeight:900,color:fc.uOk?"#16a34a":"#dc2626",fontFamily:"monospace"}}>U{fc.uj}/20</span>
   </div>
  </div>

  <div style={S.cd}>
   <div style={{color:"#d97706",fontSize:12,fontWeight:800,marginBottom:8}}>💪 상체 맥스</div>
   <select value={tD2} onChange={e=>sTD(e.target.value)} style={{...S.inp,marginBottom:8,appearance:"auto"}}>
    <option value={td}>오늘</option>
    {BT.map(t=><option key={t.d} value={t.d}>{t.d}</option>)}
   </select>
   <div style={{display:"flex",gap:8,marginBottom:8}}>
    <input type="number" placeholder="푸시업" value={ip} onChange={e=>sIp(e.target.value)} style={S.inp}/>
    <input type="number" placeholder="풀업" value={iu} onChange={e=>sIu(e.target.value)} style={S.inp}/>
   </div>
   {s1?<div style={{textAlign:"center",padding:10,color:"#16a34a",fontWeight:800}}>✓</div>
   :<button onClick={h1} style={{...S.bt,width:"100%",background:"#d97706",color:"#fff",border:"none",fontWeight:800}}>저장</button>}
  </div>

  <div style={S.cd}>
   <div style={{color:"#0891b2",fontSize:12,fontWeight:800,marginBottom:8}}>🏃 러닝 테스트</div>
   <div style={{display:"flex",gap:6,marginBottom:8}}>
    {["5K","10K"].map(t=><button key={t} onClick={()=>sRTy(t)} style={{flex:1,padding:"10px 0",borderRadius:8,fontSize:13,fontWeight:800,border:"2px solid "+(rTy===t?"#0891b2":"rgba(0,0,0,0.08)"),background:rTy===t?"rgba(8,145,178,0.08)":"#fff",color:rTy===t?"#0891b2":"#6b7c6b"}}>{t}</button>)}
   </div>
   <input type="number" step="0.1" value={rTm} onChange={e=>sRTm(e.target.value)} style={{...S.inp,marginBottom:8}} placeholder="완주 시간(분)"/>
   {s2?<div style={{textAlign:"center",padding:10,color:"#16a34a",fontWeight:800}}>✓</div>
   :<button onClick={h2} disabled={!rTm} style={{...S.bt,width:"100%",background:rTm?"#0891b2":"rgba(0,0,0,0.06)",color:rTm?"#fff":"#8a9b8a",border:"none",fontWeight:800}}>🏁 저장</button>}
  </div>

  <div style={S.cd}>
   <div style={{fontSize:10,fontWeight:800,color:"#6b7c6b",marginBottom:6}}>상체 스케줄</div>
   {BT.map(t=>{const r=T[t.d];return(
    <div key={t.d} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 8px",borderRadius:5,border:"1px solid rgba(0,0,0,0.04)",marginBottom:2}}>
     <span style={{width:40,fontSize:9,color:"#6b7c6b",fontFamily:"monospace"}}>{t.d.slice(5)}</span>
     <span style={{flex:1,fontSize:9,color:"#6b7c6b"}}>P{t.t.p}·U{t.t.u}</span>
     {r?<span style={{display:"flex",gap:4}}>
      <span style={{fontSize:9,fontWeight:800,color:r.p>=t.t.p?"#16a34a":"#dc2626"}}>P{r.p}</span>
      <span style={{fontSize:9,fontWeight:800,color:r.u>=t.t.u?"#16a34a":"#dc2626"}}>U{r.u}</span>
      <button onClick={()=>svT(t.d,null,null)} style={{background:"none",border:"none",color:"#dc2626",fontSize:9}}>✕</button>
     </span>:<span style={{color:t.d<td?"#dc2626":"#8a9b8a",fontSize:8}}>{t.d<td?"미측정":"예정"}</span>}
    </div>)})}
  </div>

  <div style={S.cd}>
   <div style={{fontSize:10,fontWeight:800,color:"#6b7c6b",marginBottom:6}}>러닝 테스트 (10월~)</div>
   {RTD.map(t=>{const dn=RT.some(x=>x.date===t.d);return(
    <div key={t.d} style={{display:"flex",justifyContent:"space-between",padding:"4px 8px",borderRadius:5,background:"rgba(0,0,0,0.02)",marginBottom:2}}>
     <span style={{fontSize:10,fontWeight:700}}>{t.l}</span>
     <span style={{color:dn?"#16a34a":t.d<td?"#dc2626":"#d97706",fontSize:10,fontWeight:800}}>{dn?"✓":t.d<td?"미측정":"D-"+db(new Date(),new Date(t.d))}</span>
    </div>)})}
  </div>
  <div style={{height:160}}/>
 </div>);
}

 app:{background:"#f0f7f0",height:"100vh",maxWidth:480,margin:"0 auto",display:"flex",flexDirection:"column",paddingTop:"env(safe-area-inset-top)",overflow:"hidden"},
 nav:{display:"flex",background:"#fff",borderBottom:"1px solid rgba(0,0,0,0.06)"},

 inp:{width:"100%",padding:"10px 12px",background:"#f0f7f0",border:"1px solid rgba(0,0,0,0.1)",borderRadius:9,color:"#1a2e1a",fontSize:14,fontWeight:600},

 dn:{width:38,height:38,borderRadius:9,background:"#fff",border:"1px solid rgba(0,0,0,0.08)",color:"#6b7c6b",fontSize:18,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0},
};

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
