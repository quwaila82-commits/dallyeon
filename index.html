<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08080f">
<title>단련 S3</title>
<style>
:root{--bg:#08080f;--card:#12121e;--card2:#1a1a2a;--acc:#4ade80;--acc2:#60a5fa;--acc3:#fbbf24;--txt:#e0e0ec;--dim:#55557a;--bdr:#222238;--r:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom,20px)}
.hdr{background:linear-gradient(135deg,#0f0f2a,#161630);padding:24px 16px 18px;text-align:center}
.hdr h1{font-size:14px;color:var(--dim);letter-spacing:2px;text-transform:uppercase}
.dday{font-size:42px;font-weight:800;background:linear-gradient(135deg,var(--acc),#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:4px 0}
.dday-sub{font-size:12px;color:var(--dim)}
.pbar{height:4px;background:#1a1a30;border-radius:2px;margin:12px 32px 0;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--acc),#22d3ee);border-radius:2px;transition:width .3s}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:10}
.tab{flex:1;padding:11px;text-align:center;font-size:13px;color:var(--dim);border:none;background:none;cursor:pointer;font-family:inherit}
.tab.on{color:var(--acc);border-bottom:2px solid var(--acc)}
.cd{background:var(--card);border-radius:var(--r);margin:10px 14px;padding:14px}
.ct{font-size:14px;font-weight:600;color:#fff;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.ci{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid #1a1a2a;gap:10px}
.ci:last-child{border-bottom:none}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid #333350;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;color:transparent;transition:all .15s;font-family:inherit}
.ck.on{background:var(--acc);border-color:var(--acc);color:#000}
.sb{display:block;width:calc(100% - 28px);margin:14px auto;padding:14px;background:var(--acc);color:#000;font-size:16px;font-weight:700;border:none;border-radius:var(--r);cursor:pointer;font-family:inherit;transition:all .2s}
.sb:active{transform:scale(.97);opacity:.9}
.sb.ok{background:#166534;color:var(--acc)}
.dn{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px}
.dn button{background:var(--card2);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;font-family:inherit}
.dn .dt{font-size:15px;font-weight:600}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sx{background:var(--card2);border-radius:10px;padding:12px;text-align:center}
.sn{font-size:26px;font-weight:700}.sl{font-size:11px;color:var(--dim);margin-top:2px}
.wd{display:flex;gap:5px;justify-content:center;margin:6px 0}
.wdot{width:34px;height:34px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim)}
.wdot.tr{background:#14532d;color:var(--acc)}.wdot.td{box-shadow:0 0 0 2px var(--acc)}
.pb{height:6px;background:#1a1a2a;border-radius:3px;overflow:hidden;margin-top:6px}
.pf{height:100%;border-radius:3px;transition:width .3s}
.pg{background:var(--acc)}.pbl{background:var(--acc2)}.py{background:var(--acc3)}
.hd{padding:10px 0;border-bottom:1px solid #1a1a2a}
.hdt{font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.htg{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.ht{font-size:10px;padding:2px 7px;border-radius:8px;background:#1a1a2a;color:var(--dim)}
.ht.ok{background:#14532d;color:var(--acc)}
.comp{text-align:center;padding:8px;margin:0 14px;background:var(--card);border-radius:var(--r);font-size:13px}
.comp b{color:var(--acc)}
.tbar{display:flex;gap:4px;cursor:pointer;padding:4px 0}
.tseg{height:28px;border-radius:6px;background:#1a1a2a;flex:1;transition:background .15s}
.tseg.on{background:var(--acc)}
.rsel{display:flex;gap:6px}
.rbtn{flex:1;padding:10px 4px;border:2px solid var(--bdr);border-radius:10px;background:var(--card2);color:var(--dim);text-align:center;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.rbtn.on{border-color:var(--acc);background:#14532d;color:var(--acc)}
.rbtn.itv.on{border-color:var(--acc3);background:#422006;color:var(--acc3)}

</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
<script>
window.onerror=function(m){document.getElementById("root").innerHTML='<div style="padding:20px;color:#f87171"><b>오류:</b> '+m+'</div>';return true};
(function(){try{var m={name:"단련 S3",short_name:"단련",start_url:"./",display:"standalone",background_color:"#08080f",theme_color:"#08080f"};var b=new Blob([JSON.stringify(m)],{type:"application/json"});var l=document.createElement("link");l.rel="manifest";l.href=URL.createObjectURL(b);document.head.appendChild(l)}catch(e){}})();
</script>
<script type="text/babel">
const {useState,useEffect} = React;

const START="2026-11-25",DDAY="2026-12-29",WT=4,ET=5;
const KD="s3-daily";
const DL=["월","화","수","목","금","토","일"];

const fmt=d=>{const x=d instanceof Date?d:new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const now=()=>fmt(new Date());
const dif=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const wkn=d=>Math.max(0,Math.floor(dif(START,d)/7));
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch{return{}}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};

/* Progressive overload targets per week */
const PU=[15,16,18,19,20], PL=[5,5,6,7,7], RN=[20,22,25,28,30];
const puT=d=>PU[Math.min(wkn(d),4)];
const plT=d=>PL[Math.min(wkn(d),4)];
const rnT=d=>RN[Math.min(wkn(d),4)];

const getWk=d=>{const dt=new Date(d),dy=dt.getDay()||7,mn=new Date(dt);mn.setDate(dt.getDate()-dy+1);return Array.from({length:7},(_,i)=>{const x=new Date(mn);x.setDate(mn.getDate()+i);return fmt(x)})};

/* Data: ev=화상영어, em=자습20분단위(0-6), yg=요가10분(0-2), pu=푸시업세트(0-5), pl=풀업세트(0-5), rn=0없음/1러닝/2인터벌 */
const E=()=>({ev:false,em:0,yg:0,pu:0,pl:0,rn:0,ts:0});
const isTr=d=>d&&(d.yg>0||d.pu>0||d.pl>0||(typeof d.rn==="number"?d.rn>0:!!d.rn));
const engMin=d=>d?(d.ev?20:0)+((d.em||0)*20):0;
const isEng=d=>engMin(d)>=120;

function App(){
  const[tab,sTab]=useState(0);
  const[sel,sSel]=useState(now());
  const[all,sAll]=useState(()=>ld(KD));
  const[dy,sDy]=useState(()=>{const d=ld(KD)[now()];return d?{...E(),...d}:E()});
  const[svd,sSvd]=useState(false);

  useEffect(()=>{const d=all[sel];sDy(d?{...E(),...d}:E());sSvd(false)},[sel]);

  const t=now(),dL=Math.max(0,dif(t,DDAY)),dT=dif(START,DDAY),dE=Math.max(0,dif(START,t));
  const pt=puT(sel),plt=plT(sel),rnt=rnT(sel);
  const isT=sel===t;

  const save=()=>{const n={...all,[sel]:{...dy,ts:Date.now()}};sAll(n);sv(KD,n);sSvd(true);if(navigator.vibrate)navigator.vibrate(50);setTimeout(()=>sSvd(false),2e3)};
  const tg=f=>sDy(p=>({...p,[f]:!p[f]}));
  const nav=d=>{const dt=new Date(sel);dt.setDate(dt.getDate()+d);const s=fmt(dt);if(s>=START&&s<=DDAY)sSel(s)};
  const setRn=v=>sDy(p=>({...p,rn:p.rn===v?0:v}));

  const wk=getWk(sel);
  const wTr=wk.filter(d=>isTr(all[d])).length;
  const wEng=wk.filter(d=>isEng(all[d])).length;
  const wEv=wk.filter(d=>all[d]&&all[d].ev).length;
  const wItv=wk.filter(d=>all[d]&&all[d].rn===2).length;

  const allD=Object.keys(all).filter(d=>d>=START&&d<=DDAY&&isTr(all[d])).sort();
  const allEng=Object.keys(all).filter(d=>d>=START&&d<=DDAY&&isEng(all[d])).sort();
  const totTr=allD.length;

  const dObj=new Date(sel),dIdx=dObj.getDay(),dName=DL[dIdx===0?6:dIdx-1];
  const dLabel=(dObj.getMonth()+1)+"/"+dObj.getDate()+" ("+dName+")";

  const dc=(()=>{let n=0;if(isEng(dy))n++;if(dy.yg>=2)n++;if(dy.pu>=5)n++;if(dy.pl>=5)n++;if(typeof dy.rn==="number"?dy.rn>0:!!dy.rn)n++;return n})();

  const rnLabel=v=>v===1?"🏃 러닝":v===2?"⚡ 인터벌":v===3?"🏊 수영":"";

  /* ── Today Tab ── */
  const rToday=()=>(
    <div>
      <div className="dn">
        <button onClick={()=>nav(-1)}>◀</button>
        <span className="dt">{isT?"오늘 ":""}{dLabel}</span>
        <button onClick={()=>nav(1)}>▶</button>
      </div>

      {/* 이번 주 운동 */}
      <div className="cd" style={{background:wTr>=WT?"rgba(52,211,153,0.1)":"rgba(255,255,255,0.03)",border:wTr>=WT?"1px solid rgba(52,211,153,0.3)":"1px solid rgba(255,255,255,0.06)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
          <span style={{fontSize:13,fontWeight:600}}>💪 운동</span>
          <span style={{fontSize:13,fontWeight:700,color:wTr>=WT?"#34d399":"var(--acc)"}}>{wTr}/{WT}일</span>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <span style={{fontSize:13,fontWeight:600}}>🗣️ 영어</span>
          <span style={{fontSize:13,fontWeight:700,color:wEng>=ET?"#34d399":"var(--acc2)"}}>{wEng}/{ET}일 <span style={{fontSize:11,color:"var(--dim)"}}>화상{wEv}/3</span></span>
        </div>
        <div style={{display:"flex",gap:4}}>
          {wk.map((d,i)=>{const tr=isTr(all[d]);const eng=isEng(all[d]);const isSel=d===sel;return(
            <div key={d} onClick={()=>sSel(d)} style={{flex:1,textAlign:"center",cursor:"pointer",padding:"4px 0",borderRadius:6,background:isSel?"rgba(99,102,241,0.2)":"transparent",border:isSel?"1px solid var(--acc)":"1px solid transparent"}}>
              <div style={{fontSize:9,color:"var(--dim)",marginBottom:2}}>{DL[i]}</div>
              <div style={{fontSize:12}}>{tr?"💪":"·"}</div>
              <div style={{fontSize:12}}>{eng?"🗣️":"·"}</div>
            </div>
          )})}
        </div>
        {wTr>=WT && <div style={{textAlign:"center",marginTop:6,fontSize:12,color:"#34d399",fontWeight:600}}>🎉 이번 주 운동 목표 달성!</div>}
        {wItv>0 && <div style={{textAlign:"center",marginTop:2,fontSize:11,color:"var(--acc3)"}}>⚡ 인터벌 {wItv}회 완료</div>}
      </div>

      {dc>0 && <div className="comp">오늘 달성: <b>{dc}/5</b> 항목 ({Math.round(dc/5*100)}%)</div>}

      <div className="cd">
        <div className="ct" style={{fontSize:12,color:"var(--dim)",fontWeight:400}}>
          🎯 W{Math.min(wkn(sel)+1,5)} — 푸시업 {pt}개×5 · 풀업 {plt}개×5 · 러닝 {rnt}분
        </div>
      </div>

      {/* 영어 */}
      <div className="cd">
        <div className="ct">🗣️ 영어 2시간 <span style={{fontSize:11,color:"var(--dim)",fontWeight:400}}>주5회 · 화상 주3회</span>
          <span style={{marginLeft:"auto",fontSize:13,color:isEng(dy)?"var(--acc)":"var(--dim)"}}>{engMin(dy)}/120분</span>
        </div>
        <div className="ci">
          <button className={"ck"+(dy.ev?" on":"")} onClick={()=>tg("ev")}>{dy.ev?"✓":""}</button>
          <div style={{flex:1,fontSize:14}}>화상영어 20분</div>
        </div>
        <div style={{paddingTop:8}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <span style={{fontSize:13}}>자습 20분×{dy.ev?5:6}</span>
            <span style={{fontSize:13,color:(dy.ev?dy.em>=5:dy.em>=6)?"var(--acc)":"var(--dim)"}}>{dy.em*20}/{dy.ev?100:120}분</span>
          </div>
          <div className="tbar" onClick={()=>sDy(p=>({...p,em:p.em>=(p.ev?5:6)?0:p.em+1}))}>
            {Array.from({length:dy.ev?5:6},(_,i)=><div key={"em"+i} className={"tseg"+(dy.em>=i+1?" on":"")}/>) }
          </div>
        </div>
      </div>

      {/* 요가 */}
      <div className="cd" onClick={()=>sDy(p=>({...p,yg:p.yg>=2?0:p.yg+1}))} style={{cursor:"pointer"}}>
        <div className="ct">🤸 요가 <span style={{fontSize:11,color:"var(--dim)",fontWeight:400}}>10분×2</span><span style={{marginLeft:"auto",fontSize:13,color:dy.yg>=2?"var(--acc)":"var(--dim)"}}>{dy.yg}/2</span></div>
        <div className="tbar">
          {[1,2].map(i=><div key={"yg"+i} className={"tseg"+(dy.yg>=i?" on":"")}/>) }
        </div>
      </div>

      {/* 푸시업 */}
      <div className="cd" onClick={()=>sDy(p=>({...p,pu:(p.pu||0)>=5?0:(p.pu||0)+1}))} style={{cursor:"pointer"}}>
        <div className="ct">💪 푸시업 <span style={{fontSize:11,color:"var(--dim)",fontWeight:400}}>{pt}개×5세트</span><span style={{marginLeft:"auto",fontSize:13,color:dy.pu>=5?"var(--acc)":"var(--dim)"}}>{dy.pu||0}/5</span></div>
        <div className="tbar">
          {[1,2,3,4,5].map(i=><div key={"pu"+i} className={"tseg"+((dy.pu||0)>=i?" on":"")}/>) }
        </div>
      </div>

      {/* 풀업 */}
      <div className="cd" onClick={()=>sDy(p=>({...p,pl:(p.pl||0)>=5?0:(p.pl||0)+1}))} style={{cursor:"pointer"}}>
        <div className="ct">🏋️ 풀업 <span style={{fontSize:11,color:"var(--dim)",fontWeight:400}}>{plt}개×5세트</span><span style={{marginLeft:"auto",fontSize:13,color:dy.pl>=5?"var(--acc)":"var(--dim)"}}>{dy.pl||0}/5</span></div>
        <div className="tbar">
          {[1,2,3,4,5].map(i=><div key={"pl"+i} className={"tseg"+((dy.pl||0)>=i?" on":"")}/>) }
        </div>
      </div>

      {/* 러닝/수영 */}
      <div className="cd">
        <div className="ct">🏃 러닝 <span style={{fontSize:11,color:"var(--dim)",fontWeight:400}}>{rnt}분 · 주1회 인터벌</span></div>
        <div className="rsel">
          <div className={"rbtn"+(dy.rn===1?" on":"")} onClick={()=>setRn(1)}>🏃<div style={{marginTop:2}}>러닝</div></div>
          <div className={"rbtn itv"+(dy.rn===2?" on":"")} onClick={()=>setRn(2)}>⚡<div style={{marginTop:2}}>인터벌</div></div>
        </div>
      </div>

      <button className={"sb"+(svd?" ok":"")} onClick={save}>
        {svd?"✓ 저장완료":"💾 저장"+(all[sel]?" (수정)":"")}
      </button>

      {all[sel]&&all[sel].ts?<div style={{textAlign:"center",fontSize:11,color:"var(--dim)",marginBottom:16}}>
        마지막 저장: {new Date(all[sel].ts).toLocaleString("ko-KR")}
      </div>:null}
    </div>
  );

  /* ── Progress Tab ── */
  const rProgress=()=>{
    const engTotal=allEng.length;
    const engHrs=Object.keys(all).filter(d=>d>=START&&d<=DDAY).reduce((s,d)=>s+engMin(all[d]),0);
    const wksE=Math.max(1,Math.ceil(Math.max(1,dE)/7));
    const compR=Math.min(100,Math.round(totTr/Math.max(1,wksE*WT)*100));
    const engR=Math.min(100,Math.round(engTotal/Math.max(1,wksE*ET)*100));
    const puDays=allD.filter(d=>(all[d].pu||0)>0).length;
    const plDays=allD.filter(d=>(all[d].pl||0)>0).length;
    const itvDays=allD.filter(d=>all[d].rn===2).length;

    return(
      <div>
        <div className="cd" style={{textAlign:"center"}}>
          <div style={{fontSize:12,color:"var(--dim)"}}>D-Day 까지</div>
          <div style={{fontSize:36,fontWeight:800,color:"var(--acc)",margin:"4px 0"}}>{dL}일</div>
          <div className="pb"><div className="pf pg" style={{width:Math.min(100,dE/dT*100)+"%"}}/></div>
          <div style={{fontSize:11,color:"var(--dim)",marginTop:4}}>{dE}일 경과 / {dT}일</div>
        </div>

        <div className="cd">
          <div className="ct">📅 이번 주</div>
          <div className="wd">
            {wk.map((d,i)=>(
              <div key={d} className={"wdot"+(isTr(all[d])?" tr":"")+(d===t?" td":"")}>
                {DL[i]}
              </div>
            ))}
          </div>
          <div style={{textAlign:"center",fontSize:13,marginTop:4}}>
            <b style={{color:wTr>=WT?"var(--acc)":"var(--acc3)"}}>{wTr}</b>
            <span style={{color:"var(--dim)"}}> / {WT}일 운동</span>
            {wTr>=WT && <span style={{marginLeft:6}}>🎯</span>}
            <span style={{marginLeft:12,color:wEng>=ET?"var(--acc2)":"var(--dim)"}}>{wEng}/{ET}일 영어</span>
          </div>
        </div>

        <div className="cd">
          <div className="ct">📊 전체 현황</div>
          <div className="sg">
            <div className="sx">
              <div className="sn" style={{color:"var(--acc)"}}>{totTr}</div>
              <div className="sl">운동일</div>
            </div>
            <div className="sx">
              <div className="sn" style={{color:compR>=80?"var(--acc)":"var(--acc3)"}}>{compR}%</div>
              <div className="sl">운동 달성률</div>
            </div>
            <div className="sx">
              <div className="sn" style={{color:"var(--acc2)"}}>{engTotal}</div>
              <div className="sl">영어일 (2h)</div>
            </div>
            <div className="sx">
              <div className="sn" style={{color:"var(--acc2)"}}>{Math.floor(engHrs/60)}h{engHrs%60>0?(engHrs%60+"m"):""}</div>
              <div className="sl">영어 누적</div>
            </div>
          </div>
        </div>

        <div className="cd">
          <div className="ct">💪 운동 진행</div>
          <div style={{marginBottom:10}}>
            <div style={{fontSize:13,display:"flex",justifyContent:"space-between"}}><span>푸시업 훈련일</span><span style={{color:"var(--acc)"}}>{puDays}일</span></div>
            <div style={{fontSize:11,color:"var(--dim)",marginTop:2}}>현재 목표: {puT(t)}개×5세트</div>
          </div>
          <div style={{marginBottom:10}}>
            <div style={{fontSize:13,display:"flex",justifyContent:"space-between"}}><span>풀업 훈련일</span><span style={{color:"var(--acc2)"}}>{plDays}일</span></div>
            <div style={{fontSize:11,color:"var(--dim)",marginTop:2}}>현재 목표: {plT(t)}개×5세트</div>
          </div>
          <div>
            <div style={{fontSize:13,display:"flex",justifyContent:"space-between"}}><span>인터벌 러닝</span><span style={{color:"var(--acc3)"}}>{itvDays}회</span></div>
          </div>
        </div>

        {/* 주간 목표표 */}
        <div className="cd">
          <div className="ct">📈 5주 점진적 과부하</div>
          <div style={{fontSize:12,lineHeight:2}}>
            {[0,1,2,3,4].map(i=>{
              const wStart=new Date(START);wStart.setDate(wStart.getDate()+i*7);
              const wEnd=new Date(wStart);wEnd.setDate(wStart.getDate()+6);
              const isCur=t>=fmt(wStart)&&t<=fmt(wEnd);
              return(
                <div key={i} style={{color:isCur?"var(--acc)":"var(--dim)",fontWeight:isCur?600:400}}>
                  {isCur?"▶ ":"  "}W{i+1} ({(wStart.getMonth()+1)}/{wStart.getDate()}~)
                  <span style={{marginLeft:8}}>푸시업 {PU[i]}×5</span>
                  <span style={{marginLeft:6,color:isCur?"var(--acc2)":"var(--dim)"}}>풀업 {PL[i]}×5</span>
                  <span style={{marginLeft:6,color:isCur?"var(--acc3)":"var(--dim)"}}>러닝 {RN[i]}분</span>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  };

  /* ── History Tab ── */
  const rHistory=()=>{
    const days=[];
    const d=new Date(DDAY);const s=new Date(START);
    while(d>=s){days.push(fmt(d));d.setDate(d.getDate()-1)}
    const filtered=days.filter(d=>d<=t);

    return(
      <div>
        <div className="cd">
          <div className="ct">📅 훈련 기록</div>
          <div style={{fontSize:12,color:"var(--dim)",marginBottom:8}}>
            운동 {totTr}일 · 영어 {allEng.length}일 / {dE}일 경과
          </div>
          {filtered.slice(0,30).map(d=>{
            const x=all[d];
            const tr=isTr(x);
            const eng=isEng(x);
            return(
              <div key={d} className="hd" onClick={()=>{sSel(d);sTab(0)}} style={{cursor:"pointer"}}>
                <div className="hdt">
                  <span style={{color:tr||eng?"var(--txt)":"var(--dim)"}}>
                    {d===t?"오늘 ":""}{new Date(d).getMonth()+1}/{new Date(d).getDate()} ({DL[new Date(d).getDay()===0?6:new Date(d).getDay()-1]})
                  </span>
                  {tr||eng?<span style={{fontSize:11,color:"var(--acc)"}}>{tr?"💪":""}  {eng?"🗣️":""}</span>
                    :<span style={{fontSize:11,color:"var(--dim)"}}>휴식</span>}
                </div>
                {(tr||eng)&&x&&(
                  <div className="htg">
                    {x.ev&&<span className="ht ok">화상영어</span>}
                    {x.em>0&&<span className="ht ok">자습{x.em*20}분</span>}
                    {x.yg>0&&<span className="ht ok">요가{x.yg}/2</span>}
                    {x.pu>0&&<span className="ht ok">푸시업{x.pu}/5</span>}
                    {x.pl>0&&<span className="ht ok">풀업{x.pl}/5</span>}
                    {x.rn===1&&<span className="ht ok">러닝</span>}
                    {x.rn===2&&<span className="ht ok" style={{background:"#422006",color:"var(--acc3)"}}>인터벌</span>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  return(
    <div>
      <div className="hdr">
        <h1>단련 S3</h1>
        <div className="dday">D-{dL}</div>
        <div className="dday-sub">🎯 12.29 최상의 컨디션 회복</div>
        <div className="pbar"><div className="pfill" style={{width:Math.min(100,dE/dT*100)+"%"}}/></div>
        <div style={{display:"flex",gap:10,marginTop:10}}>
          <div style={{flex:1}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:4}}>
              <span>🗣️ 영어</span>
              <span style={{color:"var(--acc2)",fontWeight:600}}>{Math.min(100,Math.round(allEng.length/Math.max(1,Math.ceil(Math.max(1,dE)/7)*ET)*100))}%</span>
            </div>
            <div className="pbar" style={{margin:0,height:10}}><div className="pfill" style={{width:Math.min(100,allEng.length/Math.max(1,Math.ceil(Math.max(1,dE)/7)*ET)*100)+"%",height:10,background:"linear-gradient(90deg,#60a5fa,#818cf8)"}}/></div>
          </div>
          <div style={{flex:1}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:4}}>
              <span>💪 체력</span>
              <span style={{color:"var(--acc)",fontWeight:600}}>{Math.min(100,Math.round(totTr/Math.max(1,Math.ceil(Math.max(1,dE)/7)*WT)*100))}%</span>
            </div>
            <div className="pbar" style={{margin:0,height:10}}><div className="pfill" style={{width:Math.min(100,totTr/Math.max(1,Math.ceil(Math.max(1,dE)/7)*WT)*100)+"%",height:10}}/></div>
          </div>
        </div>
      </div>

      <div className="tabs">
        {["📋 오늘","📊 현황","📅 기록"].map((t2,i)=>(
          <button key={i} className={"tab"+(tab===i?" on":"")} onClick={()=>sTab(i)}>{t2}</button>
        ))}
      </div>

      {tab===0&&rToday()}
      {tab===1&&rProgress()}
      {tab===2&&rHistory()}

      <div style={{textAlign:"center",padding:"20px 0 40px",fontSize:11,color:"#333"}}>
        단련 S3 · 11.25~12.29 · 주{WT}회 · 주{ET}회 영어
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
